name: Render Keep-Alive Backup Ping

on:
  schedule:
    # Secondary backup ping (note: GitHub cron schedules can queue-delay under load;
    # use UptimeRobot or cron-job.org as your primary 5-minute pinger!)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping StudyHub /ping endpoint (if RENDER_PING_URL variable is configured)
        env:
          PING_URL: ${{ vars.RENDER_PING_URL }}
        run: |
          if [ -z "$PING_URL" ]; then
            echo "RENDER_PING_URL repository variable is not set yet; skipping cleanly."
            exit 0
          fi
          echo "Pinging $PING_URL ..."
          curl -fsS --max-time 30 "$PING_URL"
